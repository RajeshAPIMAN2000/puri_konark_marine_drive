buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

allprojects {
    repositories {
        maven {
            // Free BGeo closed engine AAR (local Maven inside the npm package)
            url("$rootDir/../node_modules/@dc-bgeo/react-native-background-geolocation/android/libs")
        }
    }
}

// Force library modules (e.g. react-native-print) onto app compileSdk for release metadata checks.
subprojects { subproject ->
    subproject.afterEvaluate {
        if (subproject.hasProperty("android")) {
            subproject.android {
                if (compileSdkVersion == null || (compileSdkVersion instanceof Integer && compileSdkVersion < rootProject.ext.compileSdkVersion)) {
                    compileSdkVersion rootProject.ext.compileSdkVersion
                }
                if (namespace == null && project.name == "react-native-print") {
                    namespace = "com.christopherdro.reactnativeprint"
                }
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
